<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ElectriQuote – Belépés</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#17263a;background:#f3f7fc}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(140deg,#eef6ff,#fff)}main{width:min(430px,calc(100% - 32px))}.card{background:#fff;border:1px solid #d7e2ef;border-radius:20px;padding:28px;box-shadow:0 18px 45px #163e5d16}h1{margin:0 0 8px;color:#0d4d89}p{color:#61738a}form{display:grid;gap:12px}label{font-weight:700;font-size:14px}input{padding:13px;border:1px solid #bccce0;border-radius:9px;font:inherit}button{border:0;border-radius:9px;padding:12px;background:#1263a2;color:#fff;font-weight:800;cursor:pointer}#message{min-height:24px}#message[data-kind=error]{color:#b42318}
  </style>
</head>
<body><main><section class="card"><h1 id="authTitle">Belépés szükséges</h1><p>Az ElectriQuote ajánlatok és az előzmények csak bejelentkezés után érhetők el.</p><div id="message"></div><form id="loginForm"><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Jelszó<input name="password" type="password" autocomplete="current-password" required></label><button>Belépés</button></form><form id="passwordForm" hidden><label>Új jelszó<input name="password" type="password" minlength="8" required></label><label>Jelszó újra<input name="confirm" type="password" minlength="8" required></label><button>Fiók aktiválása</button></form></section></main><script type="module" src="/auth-bundle.js"></script></body>
</html>
